name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Asm/build.sh
      - name: Fail if committed .bin files are stale
        run: git diff --exit-code -- Asm

  build-and-release:
    needs: asm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Run tests to guarantee release quality
      - name: Run Tests
        run: dotnet test MashedTrainer.sln -c Release

      # Variant 1: Tiny (Framework-Dependent, ~3-5MB)
      - name: Publish Tiny (Framework-Dependent)
        run: >
          dotnet publish MashedTrainer.csproj
          -c Release
          -r win-x86
          --self-contained false
          -o dist/tiny

      # Variant 2: Standalone (Self-Contained Single-File, ~18MB)
      - name: Publish Standalone (Self-Contained Single-File)
        run: >
          dotnet publish MashedTrainer.csproj
          -c Release
          -r win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o dist/standalone

      # Package archives
      - name: Create Release Archives
        run: |
          mkdir -p release_pkgs
          (cd dist/tiny && zip -r ../../release_pkgs/MashedTrainer-${{ github.ref_name }}-Tiny-win-x86.zip .)
          (cd dist/standalone && zip -r ../../release_pkgs/MashedTrainer-${{ github.ref_name }}-Standalone-win-x86.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release_pkgs/*
