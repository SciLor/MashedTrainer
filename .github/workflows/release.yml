name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  asm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: Asm/build.sh
      - name: Fail if committed .bin files are stale
        run: git diff --exit-code -- Asm

  build:
    needs: asm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      # v4.5 targeting pack is not on the runner image; v4.8 runs the same on Windows 10+
      - run: msbuild "SciLors Mashed Trainer.csproj" /p:Configuration=Release /p:TargetFrameworkVersion=v4.8 /restore:false
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "bin/Release/*" -DestinationPath "MashedTrainer-${{ github.ref_name }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: MashedTrainer-${{ github.ref_name }}.zip
