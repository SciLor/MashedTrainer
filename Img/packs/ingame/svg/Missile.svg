    <linearGradient id="rimInner" x1="0.15" y1="0.15" x2="0.85" y2="0.85"><stop offset="0" stop-color="#731018" stop-opacity="1.000"/><stop offset="1" stop-color="#f76b73" stop-opacity="0.470"/></linearGradient>
