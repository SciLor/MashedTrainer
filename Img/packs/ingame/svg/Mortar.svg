<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32">
  <defs>
    <!-- 3D Red Ring: subtle top-left light to bottom-right shade -->
    <linearGradient id="rimOuter" x1="0.15" y1="0.15" x2="0.85" y2="0.85"><stop offset="0" stop-color="#f7525a" stop-opacity="0.990"/><stop offset="1" stop-color="#731018" stop-opacity="0.990"/></linearGradient>
    <linearGradient id="rimInner" x1="0.15" y1="0.15" x2="0.85" y2="0.85"><stop offset="0" stop-color="#731018" stop-opacity="1.000"/><stop offset="1" stop-color="#f76b73" stop-opacity="0.470"/></linearGradient>
    <!-- Outer shadow rim under bottom-right edge of red ring -->
