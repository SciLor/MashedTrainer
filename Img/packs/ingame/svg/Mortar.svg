      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#40080c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#280406" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="discClip">
